<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Aplica o tema antes da pintura (evita piscar o tema errado) */
    (function(){try{var t=localStorage.getItem('nexus-theme');
    if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
  <title>NEXUS NEWS | Zine Universitário</title>
  <meta name="description" content="NEXUS NEWS reúne notícias, curiosidades e referências para estudantes universitários.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="NEXUS NEWS">
  <meta property="og:title" content="NEXUS NEWS | Zine Universitário">
  <meta property="og:description" content="NEXUS NEWS reúne notícias, curiosidades e referências para estudantes universitários.">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/theme.js" defer></script>
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Ir para o conteúdo</a>
  <header class="site-header">
    <div class="header-inner wrap">
      <a class="brand" href="./" aria-label="NEXUS NEWS, início">
        <img src="./assets/icon.svg" width="42" height="42" alt="">
        <span class="wordmark">NEXUS <span>NEWS</span></span>
      </a>
      <nav id="primary-navigation" class="primary-nav" aria-label="Navegação principal">
        <ul>
          <li><a href="./" aria-current="page">Início</a></li>
          <li><a href="./medicina/">Medicina</a></li>
          <li><a href="./direito/">Direito</a></li>
          <li><a href="./ads/">ADS</a></li>
          <li><a href="./engenharia-civil/">Engenharia Civil</a></li>
          <li><a href="./cinema/">Cinema</a></li>
          <li><a href="./educacao-fisica/">Educação Física</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button type="button" class="theme-toggle" id="theme-toggle" role="switch"
                aria-checked="false" aria-label="Modo escuro" aria-describedby="theme-status">
          <span class="tt-track" aria-hidden="true">
            <span class="tt-star"></span><span class="tt-star"></span><span class="tt-star"></span>
            <span class="tt-thumb">
              <svg class="tt-icon tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/>
                <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>
              </svg>
              <svg class="tt-icon tt-moon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                <path class="tt-moon-star" d="M18 2.8l.6 1.7 1.7.6-1.7.6-.6 1.7-.6-1.7-1.7-.6 1.7-.6z"/>
                <path class="tt-moon-star" d="M21.2 9.2l.4 1.1 1.1.4-1.1.4-.4 1.1-.4-1.1-1.1-.4 1.1-.4z"/>
              </svg>
            </span>
          </span>
        </button>
        <span id="theme-status" class="sr-only" role="status">Tema atual: claro.</span>
        <button type="button" class="icon-button" id="search-toggle" aria-label="Buscar notícias"
                aria-controls="search-panel" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.6 15.6 4 4"/>
          </svg>
          <span class="search-button-label">Buscar</span>
        </button>
        <button type="button" class="icon-button" id="menu-toggle" aria-label="Menu"
                aria-controls="primary-navigation" aria-expanded="false">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
    <form id="search-panel" class="search-panel wrap" role="search" hidden>
      <label for="search-input">Buscar notícias</label>
      <input id="search-input" type="search" placeholder="Título, assunto ou categoria" autocomplete="off">
      <button type="button" class="search-close">Fechar</button>
    </form>
  </header>
  <main id="main" class="site-main wrap" tabindex="-1">
    <div class="edition-bar">
      <p class="edition-identity">Zine universitário</p>
      <div class="edition-details">
        <span id="edition-date"></span>
        <span id="edition-kind" class="edition-kind" hidden>Edição demonstrativa</span>
      </div>
    </div>
    <div id="content">
      <div id="data-status" class="data-status" role="status">Carregando a edição…</div>
      <noscript><p class="stage-message">Ative o JavaScript para ver as notícias.</p></noscript>
      <div data-edition-content>
      <div class="lead-grid">
        <div id="hero-content"></div>
        <div id="curiosity-content"></div>
      </div>
      <section class="news-section" aria-labelledby="latest-title">
        <div class="section-head">
          <h2 id="latest-title" class="section-title"><span>Últimas</span> notícias</h2>
        </div>
        <div id="latest-grid" class="news-grid"></div>
      </section>
      <div id="category-sections"></div>
      </div>
    </div>
    <section id="search-results" class="news-section" aria-labelledby="search-results-title" hidden>
      <div class="section-head">
        <h1 id="search-results-title" class="section-title">Resultados da busca</h1>
      </div>
      <p id="search-status" role="status"></p>
      <div class="news-grid"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner wrap">
      <a class="brand" href="./" aria-label="NEXUS NEWS, início">
        <img src="./assets/icon.svg" width="42" height="42" alt="">
        <span class="wordmark">NEXUS <span>NEWS</span></span>
      </a>
      <p>Portal de notícias universitárias</p>
    </div>
  </footer>
</body>
</html>
