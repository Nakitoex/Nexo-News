name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos do site
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll assets css data js ads cinema direito educacao-fisica engenharia-civil medicina _site/

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar o site
        uses: actions/deploy-pages@v4
        id: deployment
